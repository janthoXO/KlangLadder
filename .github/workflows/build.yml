name: Build

on:
  # Pull requests to main run Package, which calls this workflow.
  pull_request:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build app
        run: swift build

      - name: Test
        run: swift test

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raycast/package-lock.json

      - name: Lint Raycast extension
        working-directory: raycast
        run: |
          npm ci
          npm run lint
